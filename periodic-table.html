<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Periodic Table</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0c10;
  --surface: #12151c;
  --border: #1e2330;
  --text: #e8eaf0;
  --text-dim: #6b7394;
  --text-muted: #3d4566;

  /* Category colors */
  --alkali: #ff6b6b;
  --alkaline: #ffa94d;
  --transition: #ffd43b;
  --post-transition: #69db7c;
  --metalloid: #38d9a9;
  --nonmetal: #4dabf7;
  --halogen: #748ffc;
  --noble: #da77f2;
  --lanthanide: #f783ac;
  --actinide: #e599f7;
  --unknown: #868e96;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Outfit', sans-serif;
  min-height: 100vh;
  overflow-x: auto;
  position: relative;
}

body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background:
    radial-gradient(ellipse 80% 50% at 50% -20%, rgba(77, 105, 255, 0.08), transparent),
    radial-gradient(ellipse 60% 40% at 80% 100%, rgba(218, 119, 242, 0.05), transparent);
  pointer-events: none;
  z-index: 0;
}

.app {
  position: relative;
  z-index: 1;
  padding: 20px 24px 30px;
  max-width: 1440px;
  margin: 0 auto;
}

header {
  display: flex;
  align-items: baseline;
  gap: 16px;
  margin-bottom: 16px;
}

h1 {
  font-family: 'Outfit', sans-serif;
  font-weight: 800;
  font-size: 28px;
  letter-spacing: -0.5px;
  background: linear-gradient(135deg, #fff 0%, #a0aec0 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

header .subtitle {
  font-size: 13px;
  color: var(--text-dim);
  font-weight: 300;
}

/* Filter bar */
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 16px;
}

.filter-btn {
  padding: 5px 12px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-dim);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 400;
  cursor: pointer;
  transition: all 0.2s;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.filter-btn:hover {
  border-color: #4a5580;
  color: var(--text);
}

.filter-btn.active {
  border-color: var(--cat-color, #4dabf7);
  color: var(--cat-color, #4dabf7);
  background: color-mix(in srgb, var(--cat-color, #4dabf7) 10%, var(--surface));
}

/* Table grid */
.table-wrapper {
  overflow-x: auto;
  padding-bottom: 10px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(18, 1fr);
  gap: 3px;
  min-width: 900px;
}

/* Element cell */
.element {
  aspect-ratio: 1;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--surface);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  transition: all 0.2s ease;
  overflow: hidden;
  min-width: 0;
}

.element::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--cat-color);
  opacity: 0.6;
  transition: opacity 0.2s;
}

.element:hover {
  transform: scale(1.15);
  z-index: 10;
  border-color: var(--cat-color);
  box-shadow: 0 0 20px color-mix(in srgb, var(--cat-color) 30%, transparent);
}

.element:hover::before { opacity: 1; }

.element .number {
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px;
  color: var(--text-muted);
  position: absolute;
  top: 3px;
  left: 4px;
}

.element .symbol {
  font-family: 'Outfit', sans-serif;
  font-weight: 700;
  font-size: 18px;
  line-height: 1;
  color: var(--cat-color);
}

.element .name {
  font-size: 7px;
  color: var(--text-dim);
  margin-top: 1px;
  text-align: center;
  max-width: 90%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.element .mass {
  font-family: 'JetBrains Mono', monospace;
  font-size: 7px;
  color: var(--text-muted);
}

.element.dimmed {
  opacity: 0.12;
  pointer-events: none;
}

.element.highlighted {
  border-color: var(--cat-color);
  background: color-mix(in srgb, var(--cat-color) 8%, var(--surface));
}

/* Spacer */
.spacer { visibility: hidden; }

/* Lanthanide/Actinide labels */
.series-label {
  grid-column: 1 / 4;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* Gap rows */
.gap-row {
  grid-column: 1 / -1;
  height: 10px;
}

/* Detail panel */
.detail-panel {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.9);
  width: 420px;
  max-width: 92vw;
  max-height: 85vh;
  overflow-y: auto;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px;
  z-index: 1000;
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 25px 80px rgba(0,0,0,0.6);
}

.detail-panel.open {
  opacity: 1;
  pointer-events: auto;
  transform: translate(-50%, -50%) scale(1);
}

.detail-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
  z-index: 999;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}

.detail-overlay.open {
  opacity: 1;
  pointer-events: auto;
}

.detail-header {
  display: flex;
  align-items: flex-start;
  gap: 20px;
  margin-bottom: 24px;
}

.detail-symbol-box {
  width: 80px;
  height: 80px;
  border-radius: 12px;
  border: 2px solid var(--cat-color);
  background: color-mix(in srgb, var(--cat-color) 8%, var(--bg));
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.detail-symbol-box .symbol {
  font-size: 36px;
  font-weight: 800;
  color: var(--cat-color);
  line-height: 1;
}

.detail-symbol-box .number {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-dim);
}

.detail-info h2 {
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 4px;
}

.detail-info .category {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--cat-color);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.detail-close {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text-dim);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  transition: all 0.2s;
}

.detail-close:hover {
  border-color: #4a5580;
  color: var(--text);
}

.detail-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.detail-item {
  padding: 10px 12px;
  background: var(--bg);
  border-radius: 8px;
  border: 1px solid var(--border);
}

.detail-item .label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}

.detail-item .value {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
}

.detail-item .unit {
  font-size: 11px;
  color: var(--text-dim);
  font-weight: 300;
}

.detail-item.full {
  grid-column: 1 / -1;
}

.electron-config {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--text);
  word-break: break-all;
}

/* Legend */
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 10px;
  color: var(--text-dim);
}

.legend-dot {
  width: 8px;
  height: 8px;
  border-radius: 2px;
}

/* Search */
.search-box {
  position: relative;
  margin-bottom: 16px;
  max-width: 280px;
}

.search-box input {
  width: 100%;
  padding: 8px 14px 8px 34px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  outline: none;
  transition: border-color 0.2s;
}

.search-box input::placeholder { color: var(--text-muted); }
.search-box input:focus { border-color: #4a5580; }

.search-box .icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 14px;
}

/* Temperature state bar */
.temp-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}

.temp-bar label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  white-space: nowrap;
}

.temp-slider {
  flex: 1;
  max-width: 300px;
  -webkit-appearance: none;
  height: 4px;
  border-radius: 2px;
  background: linear-gradient(90deg, #4dabf7, #ffd43b, #ff6b6b);
  outline: none;
}

.temp-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: #fff;
  cursor: pointer;
  box-shadow: 0 0 6px rgba(0,0,0,0.4);
}

.temp-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--text);
  min-width: 60px;
}

.element.state-solid { }
.element.state-liquid .symbol { text-decoration: underline; text-decoration-style: wavy; text-underline-offset: 3px; }
.element.state-gas .symbol { opacity: 0.75; }
.element.state-unknown .symbol { font-style: italic; }

@media (max-width: 768px) {
  .app { padding: 12px; }
  h1 { font-size: 20px; }
  .grid { gap: 2px; }
  .element .symbol { font-size: 12px; }
  .element .name, .element .mass, .element .number { display: none; }
}
</style>
</head>
<body>

<div class="app">

    <span class="subtitle">118 Elements — Interactive Explorer</span>
  </header>

  <div class="search-box">

    <input type="text" id="search" placeholder="Search by name, symbol, or number..." autocomplete="off">
  </div>

  <div class="temp-bar">
    <label>Temperature</label>
    <input type="range" class="temp-slider" id="tempSlider" min="0" max="6000" value="293">
    <span class="temp-value" id="tempValue">293 K</span>
  </div>

  <div class="filters" id="filters"></div>

  <div class="table-wrapper">
    <div class="grid" id="grid"></div>
  </div>

  <div class="legend" id="legend"></div>
</div>

<div class="detail-overlay" id="overlay"></div>
<div class="detail-panel" id="detailPanel">

</div>

  metalloid: {label:"Metalloid", color:"var(--metalloid)"},
  nonmetal: {label:"Nonmetal", color:"var(--nonmetal)"},
  halogen: {label:"Halogen", color:"var(--halogen)"},
  noble: {label:"Noble Gas", color:"var(--noble)"},
  lanthanide: {label:"Lanthanide", color:"var(--lanthanide)"},
  actinide: {label:"Actinide", color:"var(--actinide)"},
  unknown: {label:"Unknown", color:"var(--unknown)"},
};

// Build layout: standard 18-column periodic table
function getGridPosition(el) {
  // Lanthanides (57-71) and Actinides (89-103) go in separate rows
  if (el.z >= 57 && el.z <= 71) return null; // lanthanide
  if (el.z >= 89 && el.z <= 103) return null; // actinide
  return { row: el.period, col: el.group };
}

const grid = document.getElementById('grid');
const filtersEl = document.getElementById('filters');
const legendEl = document.getElementById('legend');
const overlay = document.getElementById('overlay');
const detailPanel = document.getElementById('detailPanel');
const detailContent = document.getElementById('detailContent');
const detailClose = document.getElementById('detailClose');
const searchInput = document.getElementById('search');
const tempSlider = document.getElementById('tempSlider');
const tempValue = document.getElementById('tempValue');

let activeFilter = null;
let searchTerm = '';
let currentTemp = 293;

// Build main table layout
function buildTable() {
  grid.innerHTML = '';

  // Rows 1-7 (main table)
  for (let period = 1; period <= 7; period++) {
    for (let group = 1; group <= 18; group++) {
      const el = elements.find(e => {
        const pos = getGridPosition(e);
        return pos && pos.row === period && pos.col === group;
      });

      if (el) {
        grid.appendChild(createElementCell(el));
      } else {
        const spacer = document.createElement('div');
        spacer.className = 'spacer';
        grid.appendChild(spacer);
      }
    }
  }

  // Gap
  const gap1 = document.createElement('div');
  gap1.className = 'gap-row';
  grid.appendChild(gap1);

  // Lanthanide row (label + 3 spacers then 15 elements)
  const lanLabel = document.createElement('div');
  lanLabel.className = 'series-label';
  lanLabel.textContent = 'Lanthanides';
  grid.appendChild(lanLabel);

  const lanthanides = elements.filter(e => e.z >= 57 && e.z <= 71);
  lanthanides.forEach(el => grid.appendChild(createElementCell(el)));

  // Actinide row
  const actLabel = document.createElement('div');
  actLabel.className = 'series-label';
  actLabel.textContent = 'Actinides';
  grid.appendChild(actLabel);

  const actinides = elements.filter(e => e.z >= 89 && e.z <= 103);
  actinides.forEach(el => grid.appendChild(createElementCell(el)));
}

function createElementCell(el) {
  const div = document.createElement('div');
  div.className = 'element';
  div.style.setProperty('--cat-color', categories[el.cat]?.color || 'var(--unknown)');
  div.dataset.z = el.z;
  div.dataset.cat = el.cat;

  div.innerHTML = `
    <span class="number">${el.z}</span>
    <span class="symbol">${el.sym}</span>
    <span class="name">${el.name}</span>
    <span class="mass">${el.mass}</span>
  `;

  div.addEventListener('click', () => showDetail(el));
  return div;
}

function getStateAtTemp(el, temp) {
  if (!el.mp && !el.bp) return 'unknown';
  if (el.mp === null) {
    return temp < el.bp ? 'solid' : 'gas'; // approximation
  }
  if (el.bp === null) {
    return temp < el.mp ? 'solid' : 'liquid';
  }
  if (temp < el.mp) return 'solid';
  if (temp < el.bp) return 'liquid';
  return 'gas';
}

function updateDisplay() {
  const cells = grid.querySelectorAll('.element');
  cells.forEach(cell => {
    const z = parseInt(cell.dataset.z);
    const el = elements.find(e => e.z === z);
    const cat = cell.dataset.cat;

    // Filter logic
    let dimmed = false;
    if (activeFilter && cat !== activeFilter) dimmed = true;

    // Search logic
    if (searchTerm) {
      const s = searchTerm.toLowerCase();
      const matchesName = el.name.toLowerCase().includes(s);
      const matchesSym = el.sym.toLowerCase().includes(s);
      const matchesZ = el.z.toString() === s;
      if (!matchesName && !matchesSym && !matchesZ) dimmed = true;
    }

    cell.classList.toggle('dimmed', dimmed);
    cell.classList.toggle('highlighted', activeFilter === cat && !dimmed);

    // State at temperature
    const state = getStateAtTemp(el, currentTemp);
    cell.classList.remove('state-solid','state-liquid','state-gas','state-unknown');
    cell.classList.add('state-' + state);
  });
}

// Filters
function buildFilters() {
  const allBtn = document.createElement('button');
  allBtn.className = 'filter-btn active';
  allBtn.textContent = 'All';
  allBtn.addEventListener('click', () => {
    activeFilter = null;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    allBtn.classList.add('active');
    updateDisplay();
  });
  filtersEl.appendChild(allBtn);

  Object.entries(categories).forEach(([key, val]) => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.textContent = val.label;
    btn.style.setProperty('--cat-color', val.color);
    btn.addEventListener('click', () => {
      activeFilter = key;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      updateDisplay();
    });
    filtersEl.appendChild(btn);
  });
}

// Legend
function buildLegend() {
  Object.entries(categories).forEach(([key, val]) => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${val.color}"></span>${val.label}`;
    legendEl.appendChild(item);
  });
}

// Detail panel
function showDetail(el) {
  const color = categories[el.cat]?.color || 'var(--unknown)';
  detailPanel.style.setProperty('--cat-color', color);

  const state = getStateAtTemp(el, currentTemp);
  const disc = el.discovered < 0 ? `~${Math.abs(el.discovered)} BC` : el.discovered;

  detailContent.innerHTML = `
    <div class="detail-header">
      <div class="detail-symbol-box">
        <span class="number">${el.z}</span>
        <span class="symbol">${el.sym}</span>
      </div>
      <div class="detail-info">
        <h2>${el.name}</h2>
        <div class="category">${categories[el.cat]?.label || 'Unknown'}</div>
      </div>
    </div>
    <div class="detail-grid">
      <div class="detail-item">
        <div class="label">Atomic Mass</div>
        <div class="value">${el.mass} <span class="unit">u</span></div>
      </div>
      <div class="detail-item">
        <div class="label">State @ ${currentTemp} K</div>
        <div class="value" style="text-transform:capitalize">${state}</div>
      </div>
      <div class="detail-item">
        <div class="label">Melting Point</div>
        <div class="value">${el.mp ? el.mp + ' <span class="unit">K</span>' : '—'}</div>
      </div>
      <div class="detail-item">
        <div class="label">Boiling Point</div>
        <div class="value">${el.bp ? el.bp + ' <span class="unit">K</span>' : '—'}</div>
      </div>
      <div class="detail-item">
        <div class="label">Density</div>
        <div class="value">${el.density ? el.density + ' <span class="unit">g/cm³</span>' : '—'}</div>
      </div>
      <div class="detail-item">
        <div class="label">Electronegativity</div>
        <div class="value">${el.eneg ?? '—'}</div>
      </div>
      <div class="detail-item">
        <div class="label">Atomic Radius</div>
        <div class="value">${el.radius ? el.radius + ' <span class="unit">pm</span>' : '—'}</div>
      </div>
      <div class="detail-item">
        <div class="label">Ionization Energy</div>
        <div class="value">${el.ionization ? el.ionization + ' <span class="unit">kJ/mol</span>' : '—'}</div>
      </div>
      <div class="detail-item">
        <div class="label">Discovered</div>
        <div class="value">${disc}</div>
      </div>
      <div class="detail-item">
        <div class="label">Period / Group</div>
        <div class="value">${el.period} / ${el.group ?? '—'}</div>
      </div>
      <div class="detail-item full">
        <div class="label">Electron Configuration</div>
        <div class="electron-config">${el.econfig}</div>
      </div>
    </div>
  `;

  overlay.classList.add('open');
  detailPanel.classList.add('open');
}

function closeDetail() {
  overlay.classList.remove('open');
  detailPanel.classList.remove('open');
}

detailClose.addEventListener('click', closeDetail);
overlay.addEventListener('click', closeDetail);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

// Search
searchInput.addEventListener('input', e => {
  searchTerm = e.target.value.trim();
  updateDisplay();
});

// Temperature slider
tempSlider.addEventListener('input', e => {
  currentTemp = parseInt(e.target.value);
  tempValue.textContent = currentTemp + ' K';
  updateDisplay();
});

// Init
buildTable();
buildFilters();
buildLegend();
updateDisplay();
</script>
</body>
</html>
